
{% extends "base.html" %}

{% block extra_css %}
<style>
.edit-wrapper {
    max-width: 650px;
    margin: 35px auto;
    padding: 25px;
    background: #f2f3ff;
    border-radius: 20px;
}

.edit-card {
    background: white;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.edit-card label {
    font-weight: 600;
    margin-bottom: 7px;
}

.edit-card .form-control {
    padding: 10px;
    border-radius: 10px;
}

.save-btn {
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    border: none;
    border-radius: 25px;
    padding: 10px 25px;
}
</style>
{% endblock %}

{% block content %}
<div class="container edit-wrapper">

    <div class="edit-card">

        <h3 class="fw-bold mb-4">
            <i class="fas fa-user-edit text-primary"></i>
            Edit Admin Profile
        </h3>

        <form method="POST">

            <div class="mb-3">
                <label>User ID</label>
                <input type="text" class="form-control"
                       value="{{ user.id }}" disabled>
            </div>

            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username"
                       class="form-control"
                       value="{{ user.username }}" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email"
                       class="form-control"
                       value="{{ user.email }}" required>
            </div>

            <div class="mb-4">
                <label>New Password</label>
                <input type="password" name="password"
                       class="form-control"
                       minlength="8"
                       placeholder="Leave blank to keep current password">
            </div>

            <button type="submit" class="save-btn">
                <i class="fas fa-save me-2"></i>
                Save Changes
            </button>

            <a href="{{ url_for('admin_profile') }}"
               class="btn btn-outline-secondary rounded-pill ms-2">
                Cancel
            </a>

        </form>

    </div>
</div>
{% endblock %}
