
{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4 mx-auto"
         style="max-width: 650px;">

        <div class="card-body p-4">

            <h2 class="mb-4">
                <i class="fas fa-user-edit text-primary"></i>
                Edit User
            </h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           value="{{ user.username }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ user.email }}"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">User Role</label>

                    <select name="role" class="form-select">
                        <option value="user"
                            {% if not user.is_admin %}selected{% endif %}>
                            Regular User
                        </option>

                        <option value="admin"
                            {% if user.is_admin %}selected{% endif %}>
                            Admin
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>

                <a href="{{ url_for('admin_user_detail', user_id=user.id) }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
